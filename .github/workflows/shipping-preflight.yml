name: Shipping preflight

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shipping-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a public repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "false" ]; then
            echo "::error::The shipping guide requires a public repository."
            exit 1
          fi
      - name: Check release README and license
        run: npm run check:shipping
